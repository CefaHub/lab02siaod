name: Verify lab 2
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate variant 14 data
        run: python generate_variant_data.py
      - name: Run self-checks
        run: python lab02.py --variant 14 --data data/generated --check-only
